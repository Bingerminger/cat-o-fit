# =============================================================================
# Cat-O-Fit via Docker Compose — runs on amd64 and arm64
# (Mac, Synology Container Manager, any Docker host).
#
#   docker compose up -d      → app at http://localhost:8080
#
# By default this uses the prebuilt image from the GitHub Container Registry. To build it yourself:
#   docker compose build && docker compose up -d
# (uses the Dockerfile in this directory).
#
# Synology tip (Container Manager → Project): instead of the named volume,
# bind a folder, e.g.
#   - /volume1/docker/cat-o-fit/data:/var/www/html/data
# =============================================================================
services:
  cat-o-fit:
    image: ghcr.io/bingerminger/cat-o-fit:latest
    build: .
    container_name: cat-o-fit
    ports:
      # WARNING: The PIN protects the profiles in the app and – since v3.20.0 – the
      # private areas (cycle, labs, supplements) on the server as well. All other
      # data is reachable from every device on the network. The container therefore
      # belongs in your own, trusted network. If it is to be reachable from outside,
      # a login in front of it is MANDATORY: a reverse proxy with HTTPS and
      # authentication, or at least the built-in Basic Auth (see below).
      # To make it reachable locally only: "127.0.0.1:8080:80"
      - "8080:80"
    environment:
      # Time zone for PHP and the calendar files (e.g. Europe/Vienna, America/New_York).
      - TZ=Europe/Berlin
      # Optional: login in front of the whole app (Basic Auth). Without these lines it behaves as before.
      # - CATOFIT_BASIC_AUTH=1
      # - CATOFIT_AUTH_USER=family
      # - CATOFIT_AUTH_PASSWORD=please-use-a-long-password
      # Optional: accept only these host names (protection against DNS rebinding), comma-separated.
      # - CATOFIT_ALLOWED_HOSTS=fit.example.org
    volumes:
      - cat-o-fit-data:/var/www/html/data
    restart: unless-stopped

volumes:
  cat-o-fit-data:
