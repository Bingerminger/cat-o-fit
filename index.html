<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Zooming stays allowed (WCAG 1.4.4); the 16 px fields prevent iOS focus zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Security: only own scripts/styles; the only connections to the outside are the
       (switchable) weather query to Open-Meteo. The server adds frame-ancestors,
       among others, via header (see .htaccess). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Cat-O-Fit · Training plans for the whole family</title>
  <meta name="description" content="Training plans for the whole family – plan, train and review races and programmes, with nutrition, cycle and lab values in view. On your own server." />

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#18b48a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cat-O-Fit" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />

  <!-- Stylesheets (local, no CDNs) -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/show.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <link rel="stylesheet" href="css/session.css" />
  <link rel="stylesheet" href="css/workout-mode.css" />
  <link rel="stylesheet" href="css/family.css" />
  <link rel="stylesheet" href="css/report.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- Preload core modules in parallel instead of import by import (FE-19) -->
  <link rel="modulepreload" href="js/app.js" />
  <link rel="modulepreload" href="js/storage.js" />
  <link rel="modulepreload" href="js/ui.js" />
  <link rel="modulepreload" href="js/router.js" />
  <link rel="modulepreload" href="js/dashboard.js" />
</head>
<body class="is-anon">
  <!-- Keyboard: the first tab stop jumps straight to the content (button instead of
       a #-link, because the hash is the route) -->
  <button type="button" id="skip-link" class="skip-link" data-i18n="a11y.skipToContent">Skip to content</button>
  <!-- App scaffold (starts logged out: menus only after login, see session-gate.js) -->
  <div id="app">
    <!-- Header bar: title + context actions (filled per view). The manage banner
         sits INSIDE the sticky header – so it always stays visible at the top on iPhone, iPad and Mac. -->
    <header id="app-header" class="app-header">
      <div class="app-header__inner">
        <button id="header-back" class="icon-btn header-back" hidden aria-label="Back" data-i18n-aria="common.back"></button>
        <div class="app-header__titles">
          <h1 id="header-title" class="app-header__title" tabindex="-1">Cat-O-Fit</h1>
          <p id="header-subtitle" class="app-header__subtitle"></p>
        </div>
        <div id="header-actions" class="app-header__actions"></div>
      </div>
      <!-- Banner: an admin is currently managing another member -->
      <div id="manage-banner" class="manage-banner" role="status" hidden></div>
    </header>

    <!-- Optional side navigation (iPad / large screens) -->
    <nav id="sidebar" class="sidebar" aria-label="Main navigation" data-i18n-aria="a11y.mainNav"></nav>

    <!-- Main render area -->
    <main id="view" class="view" tabindex="-1"></main>

    <!-- Thumb-friendly bottom navigation (smartphone) -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation" data-i18n-aria="a11y.mainNav"></nav>
  </div>

  <!-- Overlays -->
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="sync-indicator" class="sync-indicator" hidden></div>

  <!-- Diagnostics: turns a "white page" into an explanatory message if the
       ES modules are not executed (see js/boot-check.js). -->
  <script src="js/boot-check.js"></script>

  <!-- Entry point (ES modules, no build step) -->
  <script type="module" src="js/app.js"></script>
  <noscript>This app needs JavaScript. · Diese App benötigt JavaScript.</noscript>
</body>
</html>
