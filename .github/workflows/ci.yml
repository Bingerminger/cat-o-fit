name: CI

# Unit and regression tests on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Read-only – the tests need no further permissions.
permissions:
  contents: read

jobs:
  test:
    name: Unit & regression tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      # No dependencies (vanilla JS, no build) – the tests run with Node's own
      # test runner (node:test), so just run them directly.
      - name: Run tests
        run: npm test

      # PHP is preinstalled on the Ubuntu runners. test-api.php starts its own
      # PHP test server with an empty temporary data directory.
      - name: PHP tests (health mapping, persistence, API, calendar)
        run: php tools/test-health-ingest.php && php tools/test-health-xml.php && php tools/test-storage.php && php tools/test-api.php && php tools/test-ics.php && php tools/test-router.php

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image as users run it (Apache, the image's PHP settings, the entrypoint): health
      # check, data/ blocked, no PHP errors in responses, the optional sign-in in front of the app.
      - name: Build image
        run: docker build -t cat-o-fit:smoke .

      - name: Smoke test
        run: IMAGE=cat-o-fit:smoke bash tools/test-docker.sh

  browser:
    name: Browser test (Chromium, WebKit, demo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      # Only for this job and not saved in package.json: the app itself has no dependencies.
      - name: Install Playwright with Chromium and WebKit
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium webkit

      # Every view in seven languages on a phone, WebKit on phone and tablet, imperial units for
      # en-US, the service worker and the offline start, the built demo without requests to outside.
      - name: Browser test
        run: node tools/test-browser.mjs
