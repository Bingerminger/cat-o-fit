name: CI

# Unit- & Regressionstests bei jedem Push auf main und bei jedem Pull Request.
on:
  push:
    branches: [main]
  pull_request:

# Nur lesen – die Tests brauchen keine weiteren Rechte.
permissions:
  contents: read

jobs:
  test:
    name: Unit- & Regressionstests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node ${{ matrix.node-version }} einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # Keine Dependencies (Vanilla JS, kein Build) – die Tests laufen mit dem
      # Node-eigenen Test-Runner (node:test). Daher direkt ausführen.
      - name: Tests ausführen
        run: npm test

      # PHP ist auf den Ubuntu-Runnern vorinstalliert. test-api.php startet sich einen
      # eigenen PHP-Testserver mit leerem Temp-Datenverzeichnis.
      - name: PHP-Tests (Health-Mapping, Persistenz, API, Kalender)
        run: php tools/test-health-ingest.php && php tools/test-health-xml.php && php tools/test-storage.php && php tools/test-api.php && php tools/test-ics.php
