name: CI

# Unit and regression tests on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Read-only – the tests need no further permissions.
permissions:
  contents: read

jobs:
  test:
    name: Unit & regression tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # No dependencies (vanilla JS, no build) – the tests run with Node's own
      # test runner (node:test), so just run them directly.
      - name: Run tests
        run: npm test

      # PHP is preinstalled on the Ubuntu runners. test-api.php starts its own
      # PHP test server with an empty temporary data directory.
      - name: PHP tests (health mapping, persistence, API, calendar)
        run: php tools/test-health-ingest.php && php tools/test-health-xml.php && php tools/test-storage.php && php tools/test-api.php && php tools/test-ics.php
