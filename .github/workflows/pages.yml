name: Demo

# The project site on GitHub Pages: the start page (English at the root, German under de/) and the
# public demo under demo/ – the app shell without PHP, with the API answered in the browser
# (js/demo-server.js). It is always built from the newest release tag – the site shows what is
# released, not the state of main:
#   • when a GitHub release is published (the last step of the release),
#   • by hand.
# No weekly run is needed: the demo data are created for the visitor's own "today" when it opens.
on:
  release:
    types: [published]
  workflow_dispatch:

# Building needs only read access; only the job that publishes may write to Pages, and it runs
# nothing but GitHub's own actions.
permissions:
  contents: read

# One deployment at a time; a newer one replaces a pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the newest release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          fi
          git checkout --quiet "$TAG"
          echo "Demo built from $TAG"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      # Since 4.2: start page + demo under demo/. A release before that has no build-site.mjs and
      # gets its demo at the root, as it was published then.
      - name: Build the site and the demo
        run: |
          if [ -f tools/build-site.mjs ]; then
            node tools/build-site.mjs --check
            node tools/build-site.mjs --out dist/site
          else
            node tools/build-demo.mjs --out dist/site
          fi

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: Publish the demo
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
