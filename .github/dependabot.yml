# Keeps the GitHub Actions pinned by commit SHA up to date (proposals arrive as pull requests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The base image of the Docker image (php:…-apache) – security updates arrive as pull requests.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
