; Cat-O-Fit — PHP runtime values for the container.

; Full Apple Health import: export.zip / export.xml can become very large.
; (health-import.php streams via XMLReader, so the RAM requirement stays small.)
upload_max_filesize = 1G
post_max_size = 1G
max_execution_time = 300
memory_limit = 256M

; Default time zone. Set a different one via the environment variable TZ (see
; docker-compose.yml): the entrypoint passes it on to PHP, the calendar files
; read it themselves (api/icstz.php).
date.timezone = Europe/Berlin

; OPcache: without it PHP re-parses all files on EVERY request. Noticeable on
; weaker NAS hardware, costs nothing.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 1000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
