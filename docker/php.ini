; Cat-O-Fit — PHP-Laufzeitwerte für den Container.

; Apple-Health-Voll-Import: export.zip / export.xml können sehr groß werden.
; (health-import.php streamt per XMLReader, der RAM-Bedarf bleibt klein.)
upload_max_filesize = 1G
post_max_size = 1G
max_execution_time = 300
memory_limit = 256M

; Standard-Zeitzone. Eine andere setzt man über die Umgebungsvariable TZ (siehe
; docker-compose.yml): Der Entrypoint übernimmt sie für PHP, die Kalender-Dateien
; lesen sie selbst (api/icstz.php).
date.timezone = Europe/Berlin

; OPcache: ohne ihn parst PHP bei JEDEM Request alle Dateien neu. Spürbar auf
; schwächerer NAS-Hardware, kostet nichts.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 1000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
