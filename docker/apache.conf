# Cat-O-Fit — Apache configuration for the container.

# Suppresses the AH00558 warning at start-up.
ServerName localhost

# Evaluate the app's .htaccess (MIME types for ES modules, Cache-Control,
# data/ access protection) — as with the Synology Web Station with the Apache backend.
<Directory /var/www/html>
    AllowOverride All
</Directory>

# Belt and braces: data/ is never reachable via HTTP, even without .htaccess.
# (The API reads the JSON files via the file system, not via HTTP.)
<Directory /var/www/html/data>
    Require all denied
</Directory>

# Command-line tools (tools/reset-pin.php) never via HTTP.
<Directory /var/www/html/tools>
    Require all denied
</Directory>
